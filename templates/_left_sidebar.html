<style>
  .app-nav {
    background: var(--sidebar-bg, #e5ebf4);
    border-radius: 0 24px 24px 0;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    padding: 20px 12px;
    z-index: 3;
    gap: 0;
  }
  .app-logo {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 4px 8px 14px;
    text-decoration: none;
    margin-bottom: 6px;
  }
  .app-logo-icon { width: 28px; height: 34px; flex-shrink: 0; }
  .app-logo-name {
    font-size: 15px;
    font-weight: 700;
    color: #111827;
    letter-spacing: -0.01em;
  }
  .app-nav-icons { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .app-nav-icon {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 10px;
    border-radius: 10px;
    color: #6b7280;
    background: transparent;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    transition: background 0.12s, color 0.12s;
    white-space: nowrap;
  }
  .app-nav-icon svg { width: 18px; height: 18px; stroke: currentColor; flex-shrink: 0; }
  .app-nav-icon:hover { background: rgba(0,0,0,0.05); color: #111827; }
  .app-nav-icon.is-active { background: rgba(0,0,0,0.08); color: #111827; font-weight: 600; }
  .app-nav-bottom {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-top: 10px;
    border-top: 1px solid rgba(0,0,0,0.07);
    margin-top: 6px;
  }
  .app-nav-bottom-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 10px;
    border-radius: 10px;
    color: #6b7280;
    background: transparent;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    border: none;
    font-family: inherit;
    transition: background 0.12s, color 0.12s;
    white-space: nowrap;
  }
  .app-nav-bottom-item svg { width: 18px; height: 18px; stroke: currentColor; flex-shrink: 0; }
  .app-nav-bottom-item:hover { background: rgba(0,0,0,0.05); color: #111827; }
</style>

<nav class="app-nav">
  <a class="app-logo" href="{{ dashboard_nav_href or ('/' ~ (current_user|urlencode)) }}" aria-label="Open dashboard">
    <svg class="app-logo-icon" viewBox="0 0 36 44" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="navLgBlue" x1="0" y1="44" x2="22" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#1a0f52"/>
          <stop offset="100%" stop-color="#5a3dbf"/>
        </linearGradient>
        <linearGradient id="navLgGold" x1="36" y1="0" x2="10" y2="44" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#f7d535"/>
          <stop offset="100%" stop-color="#e08a0a"/>
        </linearGradient>
      </defs>
      <path d="M10 40 C3 34 2 22 4 14 C6 7 12 2 18 2 C14 8 12 18 14 28 C15 34 18 40 16 42 C13 42 10 40 10 40Z" fill="url(#navLgBlue)"/>
      <path d="M18 2 C24 0 34 6 36 16 C38 27 30 42 20 44 C16 44 14 42 14 38 C14 28 18 16 18 8 C18 4 16 2 18 2Z" fill="url(#navLgGold)"/>
    </svg>
    <span class="app-logo-name">Noonchi</span>
  </a>

  <div class="app-nav-icons">
    <a class="app-nav-icon{% if active_nav_icon == 'grid' %} is-active{% endif %}" href="{{ dashboard_nav_href or ('/' ~ (current_user|urlencode)) }}" aria-label="Home">
      <svg fill="none" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12L12 3l9 9M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/></svg>
      <span>Home</span>
    </a>
    <a class="app-nav-icon{% if active_nav_icon == 'chart' %} is-active{% endif %}" href="{{ analysis_nav_href or ('/' ~ (current_user|urlencode) ~ '/analysis') }}" aria-label="Reflections">
      <svg fill="none" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      <span>Reflections</span>
    </a>
    <a class="app-nav-icon{% if active_nav_icon == 'regulation' %} is-active{% endif %}" href="{{ nudges_nav_href or ('/' ~ (current_user|urlencode) ~ '/nudges') }}" aria-label="Nudges">
      <svg fill="none" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
      <span>Nudges</span>
    </a>
    <a class="app-nav-icon{% if active_nav_icon == 'calendar' %} is-active{% endif %}" href="/{{ current_user|urlencode }}/practice" aria-label="Practice">
      <svg fill="none" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3" stroke-width="2"/></svg>
      <span>Practice</span>
    </a>
    <a class="app-nav-icon{% if active_nav_icon == 'journal' %} is-active{% endif %}" href="/{{ current_user|urlencode }}/journaling" aria-label="Journal">
      <svg fill="none" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536M9 11l6.768-6.768a2.5 2.5 0 113.536 3.536L12.536 14.536a4 4 0 01-1.657 1.01L7 17l1.454-3.879A4 4 0 019.464 11zM6 20h12"/></svg>
      <span>Journal</span>
    </a>
  </div>

  <div class="app-nav-bottom">
    <a class="app-nav-bottom-item" href="#" aria-label="Docs">
      <svg fill="none" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 16v-4M12 8h.01"/></svg>
      <span>Docs</span>
    </a>
    <button class="app-nav-bottom-item" type="button" id="navLightModeToggle" aria-label="Toggle light/dark mode">
      <svg fill="none" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <span>Light Mode</span>
    </button>
    <a class="app-nav-bottom-item" href="#" aria-label="Account">
      <svg fill="none" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
      <span>Account</span>
    </a>
  </div>
</nav>
