<style>
  .app-nav {
    background: var(--sidebar-bg, #f8fafc);
    border-radius: 0;
    border-right: 1px solid var(--border-soft, #e2e8f0);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    padding: var(--sp-8) var(--sp-5);
    z-index: 3;
    gap: 0;
  }
  .app-logo {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: var(--sp-1) var(--sp-3) var(--sp-6);
    text-decoration: none;
    margin-bottom: var(--sp-2);
  }
  .app-logo-icon { width: 28px; height: 34px; flex-shrink: 0; }
  .app-logo-name {
    font-size: var(--fs-h3);
    font-weight: var(--fw-medium);
    color: var(--text-dark);
    letter-spacing: 0;
    font-family: var(--font-heading);
  }
  .app-nav-icons { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .app-nav-icon {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: var(--sp-3) var(--sp-5);
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    color: var(--text-dark);
    background: transparent;
    font-size: var(--fs-label);
    font-weight: var(--fw-medium);
    font-family: var(--font-mono);
    text-decoration: none;
    transition: background 0.12s, color 0.12s;
    white-space: nowrap;
  }
  .app-nav-icon svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
  .app-nav-icon:hover { background: rgba(0,0,0,0.05); color: var(--text-dark); }
  .app-nav-icon.is-active {
    background: #ffffff;
    color: var(--text-dark);
    font-weight: var(--fw-semibold);
    border-color: var(--border-soft);
    box-shadow: none;
    border-radius: var(--radius-sm);
  }
  .app-nav-bottom {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-top: var(--sp-4);
    border-top: 1px solid rgba(0,0,0,0.07);
    margin-top: var(--sp-2);
  }
  .app-nav-bottom-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: var(--sp-3) var(--sp-5);
    border-radius: var(--radius-sm);
    color: var(--text-dark);
    background: transparent;
    font-size: var(--fs-label);
    font-weight: var(--fw-medium);
    font-family: var(--font-mono);
    text-decoration: none;
    cursor: pointer;
    border: none;
    transition: background 0.12s, color 0.12s;
    white-space: nowrap;
  }
  .app-nav-bottom-item svg { width: 18px; height: 18px; stroke: currentColor; flex-shrink: 0; }
  .app-nav-bottom-item:hover { background: rgba(0,0,0,0.05); color: var(--text-dark); }
</style>

<script>
  (function initVoiceAssistToggle() {
    if (window.__voiceAssistToggleInit) {
      return;
    }
    window.__voiceAssistToggleInit = true;

    const STORAGE_KEY = 'voiceAssistEnabled';
    const toggle = document.getElementById('navVoiceAssistToggle');
    const label = document.getElementById('navVoiceAssistLabel');
    if (!toggle || !label) {
      return;
    }

    const supportsSpeech = typeof window !== 'undefined' && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';

    function readEnabled() {
      if (!supportsSpeech) {
        return false;
      }
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored === null) {
        return false;
      }
      return stored === '1';
    }

    function applyUi(enabled) {
      toggle.setAttribute('aria-pressed', String(enabled));
      label.textContent = enabled ? 'Voice Assist On' : 'Voice Assist';
    }

    function broadcast(enabled) {
      window.dispatchEvent(new CustomEvent('voice-assist-change', { detail: { enabled } }));
    }

    if (!supportsSpeech) {
      toggle.disabled = true;
      toggle.setAttribute('aria-disabled', 'true');
      label.textContent = 'Voice Assist Unsupported';
      localStorage.setItem(STORAGE_KEY, '0');
      broadcast(false);
      return;
    }

    let enabled = readEnabled();
    applyUi(enabled);
    localStorage.setItem(STORAGE_KEY, enabled ? '1' : '0');
    broadcast(enabled);

    toggle.addEventListener('click', () => {
      enabled = !enabled;
      localStorage.setItem(STORAGE_KEY, enabled ? '1' : '0');
      applyUi(enabled);
      broadcast(enabled);
    });
  })();
</script>
