<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reflections</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    /* tokens inherited from styles.css */

    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { font-family: var(--font-heading); background: var(--bg-main); color: var(--text-dark); }
    .analysis-layout { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 16px; height: 100vh; width: 100vw; padding: 16px; }

    /* ── Main panel ── */
    .analysis-main { min-width: 0; border-radius: 8px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.06); display: flex; flex-direction: column; overflow: hidden; }

    /* ── Top bar ── */
    .ref-topbar { display: flex; align-items: center; justify-content: space-between; padding: 20px 28px 0; flex-shrink: 0; }
    .ref-back { display: inline-flex; align-items: center; gap: 8px; color: var(--text-dark); text-decoration: none; font-size: var(--fs-h2); font-weight: var(--fw-bold); letter-spacing: -0.03em; }
    .ref-back svg { width: 22px; height: 22px; stroke: currentColor; flex-shrink: 0; }
    .ref-search-btn { width: 34px; height: 34px; border: 0; border-radius: var(--radius-sm); background: var(--bg-main); color: var(--text-dark); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    .ref-search-btn svg { width: 18px; height: 18px; stroke: currentColor; }

    /* ── Filter bar ── */
    .ref-filterbar { display: flex; align-items: center; gap: 10px; padding: 16px 28px 0; flex-shrink: 0; }
    .ref-tabs { display: flex; align-items: center; gap: 6px; flex: 1; }
    .ref-tab { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius-sm); border: none; font: inherit; font-size: var(--fs-label); font-weight: var(--fw-medium); font-family: var(--font-mono); cursor: pointer; transition: background 0.12s, color 0.12s; background: transparent; color: var(--text-muted); }
    .ref-tab-count { font-size: var(--fs-label); font-weight: var(--fw-bold); }
    .ref-tab.is-active { background: #1c1b1f; color: #fff; }
    .ref-tab:not(.is-active):hover { background: rgba(0,0,0,0.05); color: var(--text-dark); }
    .ref-filter-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius-sm); border: 1px solid #e5e7eb; font: inherit; font-size: var(--fs-label); font-weight: var(--fw-medium); font-family: var(--font-mono); cursor: pointer; background: #fff; color: var(--text-muted); }
    .ref-filter-btn svg { width: 14px; height: 14px; stroke: currentColor; }

    /* ── Scrollable sessions area ── */
    .ref-scroll { flex: 1; overflow-y: auto; padding: 20px 28px 32px; }

    /* ── Date group ── */
    .ref-group { margin-bottom: 28px; }
    .ref-group-title { font-size: var(--fs-body); font-weight: var(--fw-bold); color: var(--text-muted); margin: 0 0 14px; }

    /* ── Card grid ── */
    .ref-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

    /* ── Card base ── */
    .ref-card { border-radius: var(--card-radius); padding: 18px; cursor: pointer; transition: transform 0.13s, box-shadow 0.13s; position: relative; }
    .ref-card:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0,0,0,0.10); }

    /* New card — purple */
    .ref-card--new { background: #4f46e5; color: #fff; }
    .ref-card--new .ref-card-date { color: rgba(255,255,255,0.95); font-size: 15px; font-weight: 700; }
    .ref-card--new .ref-card-name { color: #fff; }
    .ref-card--new .ref-card-meta { color: rgba(255,255,255,0.75); }
    .ref-card--new .ref-card-summary-label { color: rgba(255,255,255,0.7); }
    .ref-card--new .ref-card-summary-text { color: rgba(255,255,255,0.85); }
    .ref-card--new .ref-card-arrow { color: rgba(255,255,255,0.6); }

    /* Completed card — white */
    .ref-card--completed { background: #fff; border: 1px solid #e5e7eb; color: var(--text-dark); }
    .ref-card--completed .ref-card-date { color: var(--text-dark); font-size: 15px; font-weight: 700; }
    .ref-card--completed .ref-card-name { color: var(--text-dark); }
    .ref-card--completed .ref-card-meta { color: var(--text-muted); }
    .ref-card--completed .ref-card-summary-label { color: var(--text-muted); }
    .ref-card--completed .ref-card-summary-text { color: #374151; }
    .ref-card--completed .ref-card-arrow { color: #9ca3af; }

    /* Card internals */
    .ref-card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
    .ref-card-badge { font-size: var(--fs-xs); font-weight: var(--fw-medium); padding: 3px 9px; border-radius: var(--radius-sm); background: #fff; color: #4f46e5; font-family: var(--font-mono); }
    .ref-card-name { font-size: var(--fs-h2); font-weight: var(--fw-medium); line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 8px; font-family: var(--font-heading); }
    .ref-card-meta { display: flex; flex-direction: column; gap: 3px; font-size: var(--fs-label); margin-bottom: 12px; font-family: var(--font-mono); }
    .ref-card-meta-row { display: flex; align-items: center; gap: 5px; }
    .ref-card-meta-row svg { width: 12px; height: 12px; stroke: currentColor; flex-shrink: 0; }
    .ref-card-avatars { display: flex; align-items: center; margin-bottom: 12px; }
    .ref-card-avatar { width: 24px; height: 24px; border-radius: var(--radius-full); background: linear-gradient(135deg, #fca5a5, #fcd34d); border: 2px solid #fff; margin-right: -6px; }
    .ref-card-avatar.b { background: linear-gradient(135deg, #93c5fd, #c4b5fd); }
    .ref-card-avatar-more { margin-left: 10px; font-size: var(--fs-xs); font-weight: var(--fw-bold); }
    .ref-card--new .ref-card-avatar { border-color: #4f46e5; }
    .ref-card--new .ref-card-avatar-more { color: rgba(255,255,255,0.75); }
    .ref-card-summary-label { font-size: var(--fs-xs); font-weight: var(--fw-medium); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; font-family: var(--font-mono); }
    .ref-card-summary-text { font-size: 12px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ref-card-footer { display: flex; justify-content: flex-end; margin-top: 10px; }
    .ref-card-arrow { font-size: 18px; font-weight: 700; }

    /* empty state */
    .ref-empty { padding: 32px; text-align: center; color: var(--text-muted); font-size: 14px; }

    @media (max-width: 1100px) { .ref-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 980px) {
      body { overflow: auto; }
      .analysis-layout { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
      .ref-cards { grid-template-columns: 1fr; }
    }

    /* ── Processing card ── */
    .ref-card--processing { background: #fff; border: 1px solid #fde68a; cursor: default; }
    .ref-card--processing:hover { transform: none; box-shadow: none; }
    .ref-card-badge-proc { font-size: var(--fs-xs); font-weight: var(--fw-medium); padding: 3px 9px; border-radius: var(--radius-sm); background: #fef2b6; color: #9d7b27; font-family: var(--font-mono); }
    .ref-proc-bar-wrap { height: 4px; background: #fef9c3; border-radius: var(--radius-sm); overflow: hidden; margin: 10px 0 6px; }
    .ref-proc-bar { height: 100%; background: #d97706; border-radius: var(--radius-sm); transition: width 0.4s ease; }
    .ref-proc-log { font-size: 11px; color: var(--text-muted); }
  </style>
</head>
{% set resolved_user = current_user or '' %}
{% set active_nav_icon = 'chart' %}
{% set dashboard_nav_href = '/' ~ (resolved_user|urlencode) %}
{% set analysis_nav_href = '/' ~ (resolved_user|urlencode) ~ '/analysis' %}
<body data-current-user="{{ resolved_user }}">
  <div class="analysis-layout">
    {% include '_left_sidebar.html' %}
    <main class="analysis-main">

      <div class="ref-topbar">
        <a class="ref-back" href="{{ dashboard_nav_href }}">
          <svg fill="none" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          Reflections
        </a>
        <button class="ref-search-btn" type="button" aria-label="Search">
          <svg fill="none" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </button>
      </div>

      <div class="ref-filterbar">
        <div class="ref-tabs" role="tablist">
          <button class="ref-tab is-active" type="button" data-filter="all" role="tab" aria-selected="true">
            <svg fill="none" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/></svg>
            All <span class="ref-tab-count" id="tabCountAll">0</span>
          </button>
          <button class="ref-tab" type="button" data-filter="new" role="tab" aria-selected="false">
            <svg fill="none" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            New <span class="ref-tab-count" id="tabCountNew">0</span>
          </button>
          <button class="ref-tab" type="button" data-filter="completed" role="tab" aria-selected="false">
            <svg fill="none" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            Completed <span class="ref-tab-count" id="tabCountCompleted">0</span>
          </button>
        </div>
        <button class="ref-filter-btn" type="button">
          <svg fill="none" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h18M7 12h10M11 20h2"/></svg>
          Filter
        </button>
      </div>

      <div class="ref-scroll">
        <div id="procContainer"></div>
        <div id="sessionGroups"></div>
      </div>

    </main>
  </div>

  <script>
    const currentUser = document.body.dataset.currentUser || '';
    const sessionGroups = document.getElementById('sessionGroups');
    const tabCountAll = document.getElementById('tabCountAll');
    const tabCountNew = document.getElementById('tabCountNew');
    const tabCountCompleted = document.getElementById('tabCountCompleted');
    let allSessions = [];
    let activeFilter = 'all';

    function escapeHtml(v) {
      return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function ordinal(n) {
      const s = ['th','st','nd','rd'], v = n % 100;
      return n + (s[(v-20)%10]||s[v]||s[0]);
    }

    function formatCardDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d)) return '';
      const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      return `${ordinal(d.getDate())} ${months[d.getMonth()]} ${d.getFullYear()}`;
    }

    function formatCardTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d)) return '';
      let h = d.getHours(), m = d.getMinutes();
      const ampm = h >= 12 ? 'pm' : 'am';
      h = h % 12 || 12;
      return `${h}:${String(m).padStart(2,'0')} ${ampm}`;
    }

    function getDateGroup(iso) {
      if (!iso) return 'Older';
      const d = new Date(iso);
      if (isNaN(d)) return 'Older';
      const now = new Date();
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const daysAgo = Math.floor((startOfToday - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
      if (daysAgo < 7)  return 'This Week';
      if (daysAgo < 14) return 'Last Week';
      if (daysAgo < 60) return 'Last Month';
      return 'Older';
    }

    function isNew(s) { return !s.openedAt; }

    function renderCards(sessions) {
      const filtered = sessions.filter(s => {
        if (activeFilter === 'new')       return isNew(s);
        if (activeFilter === 'completed') return !isNew(s);
        return true;
      });

      const groups = {};
      const order = ['This Week','Last Week','Last Month','Older'];
      for (const s of filtered) {
        const g = getDateGroup(s.uploadedAt);
        if (!groups[g]) groups[g] = [];
        groups[g].push(s);
      }

      const html = order
        .filter(g => groups[g]?.length)
        .map(g => {
          const cards = groups[g].map(s => {
            const cls = isNew(s) ? 'ref-card--new' : 'ref-card--completed';
            const badge = isNew(s) ? `<span class="ref-card-badge">New</span>` : '';
            return `
              <article class="ref-card ${cls}" data-id="${escapeHtml(s.id)}" data-session="${escapeHtml(s.sessionName)}">
                <div class="ref-card-header">
                  <span class="ref-card-date">${escapeHtml(formatCardDate(s.uploadedAt))}</span>
                  ${badge}
                </div>
                <div class="ref-card-name">${escapeHtml(s.displayName || s.sessionName)}</div>
                <div class="ref-card-meta">
                  <span class="ref-card-meta-row">
                    <svg fill="none" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke-width="2"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6l4 2"/></svg>
                    ${escapeHtml(formatCardTime(s.uploadedAt))}
                  </span>
                </div>
                <div class="ref-card-avatars">
                  <div class="ref-card-avatar"></div>
                  <div class="ref-card-avatar b"></div>
                  <span class="ref-card-avatar-more">+1</span>
                </div>
                ${s.firstSegmentText ? `
                <div class="ref-card-summary-label">Summary</div>
                <div class="ref-card-summary-text">${escapeHtml(s.firstSegmentText)}</div>
                ` : ''}
                <div class="ref-card-footer"><span class="ref-card-arrow">→</span></div>
              </article>`;
          }).join('');
          return `<div class="ref-group"><h2 class="ref-group-title">${escapeHtml(g)}</h2><div class="ref-cards">${cards}</div></div>`;
        }).join('');

      sessionGroups.innerHTML = html || `<div class="ref-empty">No sessions found.</div>`;

      sessionGroups.querySelectorAll('.ref-card').forEach(card => {
        card.addEventListener('click', async () => {
          const meetingId = card.dataset.id;
          const sessionName = card.dataset.session;
          if (meetingId) {
            fetch(`/api/meetings/${encodeURIComponent(meetingId)}/open`, { method: 'POST' }).catch(() => {});
          }
          window.location.href = `/${encodeURIComponent(currentUser)}/analysis/${encodeURIComponent(sessionName)}`;
        });
      });
    }

    function updateCounts() {
      tabCountAll.textContent = allSessions.length;
      tabCountNew.textContent = allSessions.filter(s => isNew(s)).length;
      tabCountCompleted.textContent = allSessions.filter(s => !isNew(s)).length;
    }

    document.querySelectorAll('.ref-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.ref-tab').forEach(t => { t.classList.remove('is-active'); t.setAttribute('aria-selected','false'); });
        tab.classList.add('is-active');
        tab.setAttribute('aria-selected','true');
        activeFilter = tab.dataset.filter;
        renderCards(allSessions);
      });
    });

    async function loadSessions() {
      if (!currentUser.trim()) { sessionGroups.innerHTML = '<div class="ref-empty">No user selected.</div>'; return; }
      const res = await fetch(`/reflection/${encodeURIComponent(currentUser)}`);
      const data = await res.json();
      allSessions = Array.isArray(data.sessions) ? data.sessions : [];
      updateCounts();
      renderCards(allSessions);
    }

    /* ── Processing card — reconnects to server active job on page load ── */
    const procContainer = document.getElementById('procContainer');

    function phaseLbl(p) { return p === 'upload' ? 'Uploading' : p === 'pipeline' ? 'Analysing' : p || 'Processing'; }

    function renderProcCard(meetingName, phase, pct, msg) {
      procContainer.innerHTML = `
        <div class="ref-group">
          <h2 class="ref-group-title">Processing</h2>
          <div class="ref-cards">
            <article class="ref-card ref-card--processing">
              <div class="ref-card-header">
                <span class="ref-card-date">In progress</span>
                <span class="ref-card-badge-proc" id="procBadge">${escapeHtml(phaseLbl(phase))}</span>
              </div>
              <div class="ref-card-name">${escapeHtml(meetingName || 'Meeting')}</div>
              <div class="ref-proc-bar-wrap"><div class="ref-proc-bar" id="procBar" style="width:${pct || 0}%"></div></div>
              <div class="ref-proc-log" id="procLog">${escapeHtml(msg || '')}</div>
            </article>
          </div>
        </div>`;
    }

    function updateProcCard(pct, msg, phase) {
      const badge = document.getElementById('procBadge');
      const bar   = document.getElementById('procBar');
      const log   = document.getElementById('procLog');
      if (badge && phase) badge.textContent = phaseLbl(phase);
      if (bar)   bar.style.width = pct + '%';
      if (log)   log.textContent = msg || '';
    }

    function clearProcCard() { procContainer.innerHTML = ''; }

    function procFollowSSE(url, onProgress, isDone) {
      return new Promise((resolve, reject) => {
        const es = new EventSource(url);
        es.onmessage = (e) => {
          let data; try { data = JSON.parse(e.data); } catch(_) { return; }
          onProgress(data);
          if (isDone(data)) { es.close(); resolve(data); }
        };
        es.onerror = () => { es.close(); reject(new Error('SSE lost')); };
      });
    }

    async function runPipelineSSE(jobId, initialProgress) {
      await procFollowSSE(
        `/api/pipeline/job/${jobId}/stream`,
        (data) => updateProcCard(50 + Math.round(((data.progress||0) / (data.total||5)) * 50), data.message||'', 'pipeline'),
        (data) => data.status === 'done' || data.status === 'error'
      );
      updateProcCard(100, 'Reflections ready', 'done');
      setTimeout(() => { clearProcCard(); loadSessions(); }, 2500);
    }

    async function initProcessingCard() {
      let state;
      try { const r = await fetch('/api/processing/active'); state = await r.json(); } catch(_) { return; }
      if (!state || !state.phase) return;

      const initPct = state.phase === 'upload'
        ? Math.round((state.progress || 0) * 0.5)
        : 50 + Math.round(((state.progress || 0) / (state.total || 5)) * 50);
      renderProcCard(state.meeting_name, state.phase, initPct, state.message);

      try {
        if (state.phase === 'upload') {
          const result = await procFollowSSE(
            `/api/audio/upload/job/${state.job_id}/stream`,
            (data) => updateProcCard(Math.round((data.progress||0) * 0.5), data.message||'', 'upload'),
            (data) => data.record
          );
          updateProcCard(50, 'Running analysis\u2026', 'pipeline');
          const pr = await fetch(`/api/pipeline/run/${encodeURIComponent(result.record.id)}`, { method: 'POST' });
          if (!pr.ok) throw new Error('Pipeline start failed');
          const { job_id: pipeJobId } = await pr.json();
          await runPipelineSSE(pipeJobId, 0);
        } else if (state.phase === 'pipeline') {
          await runPipelineSSE(state.job_id, state.progress);
        }
      } catch(err) {
        console.warn('Processing reconnect failed:', err);
        clearProcCard();
      }
    }

    /* Also respond to same-page widget events */
    window.addEventListener('mw:processing', (e) => {
      const { meetingName, phase, progress, total, message } = e.detail;
      const pct = phase === 'upload' ? Math.round((progress||0) * 0.5) : 50 + Math.round(((progress||0) / (total||5)) * 50);
      if (!document.getElementById('procBar')) renderProcCard(meetingName, phase, pct, message);
      else updateProcCard(pct, message, phase);
    });
    window.addEventListener('mw:processingDone', () => { setTimeout(() => { clearProcCard(); loadSessions(); }, 2500); });
    window.addEventListener('mw:processingError', () => { setTimeout(clearProcCard, 6000); });

    initProcessingCard();
    loadSessions();
  </script>
</body>
</html>
