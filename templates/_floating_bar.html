<!-- Pop-out trigger button — visible until PiP is open -->
<button id="fb-pip-trigger" type="button" aria-label="Pop out floating bar">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
    <rect x="2" y="3" width="20" height="14" rx="2"/>
    <path d="M8 21h8M12 17v4"/>
    <path d="M15 8 L19 4 M19 4 H15 M19 4 V8"/>
  </svg>
  Pop out
</button>

<!-- The actual floating bar — gets MOVED into the PiP window on launch -->
<div id="floating-bar">

  <div class="fb-strip">

    <div class="fb-logo-slot" aria-hidden="true">
      <svg viewBox="0 0 36 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="fbLgBlue" x1="0" y1="44" x2="22" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%"   stop-color="#1a0f52"/>
            <stop offset="100%" stop-color="#5a3dbf"/>
          </linearGradient>
          <linearGradient id="fbLgGold" x1="36" y1="0" x2="10" y2="44" gradientUnits="userSpaceOnUse">
            <stop offset="0%"   stop-color="#f7d535"/>
            <stop offset="100%" stop-color="#e08a0a"/>
          </linearGradient>
        </defs>
        <path d="M10 40 C3 34 2 22 4 14 C6 7 12 2 18 2 C14 8 12 18 14 28 C15 34 18 40 16 42 C13 42 10 40 10 40Z"
              fill="url(#fbLgBlue)"/>
        <path d="M18 2 C24 0 34 6 36 16 C38 27 30 42 20 44 C16 44 14 42 14 38 C14 28 18 16 18 8 C18 4 16 2 18 2Z"
              fill="url(#fbLgGold)"/>
      </svg>
    </div>

    <button class="fb-btn" type="button" aria-label="Open transcript">
      <svg class="fb-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="9" y1="13" x2="15" y2="13"/>
        <line x1="9" y1="17" x2="13" y2="17"/>
      </svg>
      <span>Transcript</span>
    </button>

    <button class="fb-btn" type="button" aria-label="Icon nudge">
      <svg class="fb-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 6.5 C12 4.5 13.5 3 15.5 3 C15.5 5.5 13.5 6.5 12 6.5Z"/>
        <path d="M7 11 C7 8 9.2 6.5 12 6.5 C14.8 6.5 17 8 17 11 C17 15.5 14.5 21 12 21 C9.5 21 7 15.5 7 11Z"/>
      </svg>
      <span>Icon Nudge</span>
    </button>

    <button class="fb-btn fb-btn--active" type="button" id="fb-toggle-btn" data-mode="watch" aria-label="Switch output: Watch">
      <svg id="fb-icon-watch" class="fb-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="7"/>
        <polyline points="12 9 12 12 13.5 13.5"/>
        <path d="M9 3 l.6-1.5 h4.8 L15 3"/>
        <path d="M9 21 l.6 1.5 h4.8 L15 21"/>
      </svg>
      <svg id="fb-icon-desktop" class="fb-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
        <rect x="2" y="4" width="20" height="14" rx="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="18" x2="12" y2="21"/>
      </svg>
      <span id="fb-toggle-label">Watch</span>
    </button>

  </div>

  <div class="fb-footer">
    <div class="fb-timer">
      <span class="fb-rec-dot"></span>
      <span id="fb-timer-val">0:00:00</span>
    </div>
    <button class="fb-stop-btn" type="button" aria-label="Stop recording">Stop</button>
  </div>

</div>

<script>
(function () {

  function initToggle(doc) {
    var btn   = doc.getElementById('fb-toggle-btn');
    var iW    = doc.getElementById('fb-icon-watch');
    var iD    = doc.getElementById('fb-icon-desktop');
    var label = doc.getElementById('fb-toggle-label');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var isWatch = btn.dataset.mode === 'watch';
      btn.dataset.mode    = isWatch ? 'desktop' : 'watch';
      iW.style.display    = isWatch ? 'none' : '';
      iD.style.display    = isWatch ? '' : 'none';
      label.textContent   = isWatch ? 'Desktop' : 'Watch';
    });
  }
  initToggle(document);

  var trigger = document.getElementById('fb-pip-trigger');
  var bar     = document.getElementById('floating-bar');
  var pipWin  = null;

  if (!window.documentPictureInPicture) {
    if (trigger) trigger.style.display = 'none';
  } else if (trigger) {
    trigger.addEventListener('click', async function () {
      if (pipWin) { pipWin.close(); return; }

      pipWin = await window.documentPictureInPicture.requestWindow({
        width: 480,
        height: 130,
        preferTransparentBackground: true,
      });

      // Copy main stylesheet
      var link  = pipWin.document.createElement('link');
      link.rel  = 'stylesheet';
      link.href = document.querySelector('link[rel="stylesheet"]').href;
      pipWin.document.head.appendChild(link);

      // PiP-specific reset — transparent body, no margins, bar floats naturally
      var style = pipWin.document.createElement('style');
      style.textContent = [
        '* { box-sizing: border-box; margin: 0; padding: 0; }',
        'html, body { background: transparent !important; display:flex;',
        '  align-items:center; justify-content:center;',
        '  height:100%; overflow:hidden;',
        "  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }",
        '#floating-bar { position:static !important; transform:none !important; bottom:auto; left:auto; }',
      ].join('\n');
      pipWin.document.head.appendChild(style);

      // Move bar into PiP window
      pipWin.document.body.appendChild(bar);
      initToggle(pipWin.document);
      trigger.textContent = '✕ Close pop-out';

      pipWin.addEventListener('pagehide', function () {
        document.body.appendChild(bar);
        initToggle(document);
        trigger.textContent = 'Pop out';
        pipWin = null;
      });
    });
  }

})();
</script>
