# codesign2 nginx config — Dev (local) variant
# Services run directly on localhost instead of Docker containers
# Public entry point: http://localhost:5000
# Routes to:
#   processing  → http://127.0.0.1:5002
#   ui          → http://127.0.0.1:5001

server {
    listen 5000;
    server_name localhost;

    # ── Wizard UI ─────────────────────────────────────────────────────────────
    location /wizard {
        proxy_pass         http://127.0.0.1:5002;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── Pipeline SSE — disable buffering so events stream immediately ─────────
    location /api/pipeline/ {
        proxy_pass              http://127.0.0.1:5002;
        proxy_set_header        Host $host;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      3600s;
        chunked_transfer_encoding on;
    }

    # ── Processing status (active job query) ────────────────────────────────
    location /api/processing/ {
        proxy_pass         http://127.0.0.1:5002;
        proxy_set_header   Host $host;
    }

    # ── Voice job SSE stream ──────────────────────────────────────────────────
    location ~ ^/api/voice/job/ {
        proxy_pass              http://127.0.0.1:5002;
        proxy_set_header        Host $host;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      600s;
        chunked_transfer_encoding on;
    }

    # ── Voice generation (returns job_id immediately, generation runs async) ──
    location = /api/voice/generate {
        proxy_pass         http://127.0.0.1:5002;
        proxy_set_header   Host $host;
        proxy_read_timeout 10s;
    }

    # ── Audio routes that live ONLY on ui_server (5001) ───────────────────────
    location = /api/audio/sessions {
        proxy_pass         http://127.0.0.1:5001;
        proxy_set_header   Host $host;
    }
    location = /api/audio/latest {
        proxy_pass         http://127.0.0.1:5001;
        proxy_set_header   Host $host;
    }
    location ~ ^/api/audio/session/[^/]+/reflections$ {
        proxy_pass         http://127.0.0.1:5001;
        proxy_set_header   Host $host;
    }
    location ~ ^/api/audio/session/[^/]+/emotion$ {
        proxy_pass         http://127.0.0.1:5001;
        proxy_set_header   Host $host;
    }
    location ~ ^/api/audio/reflection/[^/]+/practice$ {
        proxy_pass         http://127.0.0.1:5001;
        proxy_set_header   Host $host;
    }

    # ── Upload transcription SSE stream ─────────────────────────────────────
    location ~ ^/api/audio/upload/job/ {
        proxy_pass              http://127.0.0.1:5002;
        proxy_set_header        Host $host;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      7200s;
        chunked_transfer_encoding on;
    }

    # ── All other /api/audio/ → processing_server (upload, CRUD, intents…) ────
    location /api/audio/ {
        proxy_pass         http://127.0.0.1:5002;
        proxy_set_header   Host $host;
        client_max_body_size 500m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── Live graph evaluation ─────────────────────────────────────────────────
    location = /play_graph {
        proxy_pass         http://127.0.0.1:5002;
        proxy_set_header   Host $host;
    }

    # ── Save recording ────────────────────────────────────────────────────────
    location = /save_recording {
        proxy_pass         http://127.0.0.1:5002;
        proxy_set_header   Host $host;
        client_max_body_size 500m;
    }

    # ── Everything else → ui_server ───────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:5001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
