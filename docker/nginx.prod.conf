# codesign2 nginx prod config — noonchi.live
# HTTP  → redirect to HTTPS (except ACME challenges)
# HTTPS → proxy to all services

server {
    listen 80;
    server_name noonchi.live www.noonchi.live;

    # Let's Encrypt ACME challenge (used for cert issuance + renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name noonchi.live www.noonchi.live;

    ssl_certificate     /etc/letsencrypt/live/noonchi.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noonchi.live/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # ── Wizard UI ─────────────────────────────────────────────────────────────
    location /wizard {
        proxy_pass         http://processing:5002;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── Pipeline SSE — disable buffering so events stream immediately ─────────
    location /api/pipeline/ {
        proxy_pass              http://processing:5002;
        proxy_set_header        Host $host;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      3600s;
        chunked_transfer_encoding on;
    }

    # ── Voice job SSE stream ──────────────────────────────────────────────────
    location ~ ^/api/voice/job/ {
        proxy_pass              http://processing:5002;
        proxy_set_header        Host $host;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      600s;
        chunked_transfer_encoding on;
    }

    # ── Voice generation (returns job_id immediately, generation runs async) ──
    location = /api/voice/generate {
        proxy_pass         http://processing:5002;
        proxy_set_header   Host $host;
        proxy_read_timeout 10s;
    }

    # ── Audio routes that live ONLY on ui_server (5001) ───────────────────────
    location = /api/audio/sessions {
        proxy_pass         http://ui:5001;
        proxy_set_header   Host $host;
    }
    location = /api/audio/latest {
        proxy_pass         http://ui:5001;
        proxy_set_header   Host $host;
    }
    location ~ ^/api/audio/session/[^/]+/reflections$ {
        proxy_pass         http://ui:5001;
        proxy_set_header   Host $host;
    }
    location ~ ^/api/audio/session/[^/]+/emotion$ {
        proxy_pass         http://ui:5001;
        proxy_set_header   Host $host;
    }
    location ~ ^/api/audio/reflection/[^/]+/practice$ {
        proxy_pass         http://ui:5001;
        proxy_set_header   Host $host;
    }

    # ── Upload transcription SSE stream ──────────────────────────────────────
    location ~ ^/api/audio/upload/job/ {
        proxy_pass              http://processing:5002;
        proxy_set_header        Host $host;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      7200s;
        chunked_transfer_encoding on;
    }

    # ── All other /api/audio/ → processing_server (upload, CRUD, intents…) ────
    location /api/audio/ {
        proxy_pass         http://processing:5002;
        proxy_set_header   Host $host;
        client_max_body_size 500m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── Live graph evaluation ─────────────────────────────────────────────────
    location = /play_graph {
        proxy_pass         http://processing:5002;
        proxy_set_header   Host $host;
    }

    # ── Save recording ────────────────────────────────────────────────────────
    location = /save_recording {
        proxy_pass         http://processing:5002;
        proxy_set_header   Host $host;
        client_max_body_size 500m;
    }

    # ── Everything else → ui_server ───────────────────────────────────────────
    location / {
        proxy_pass         http://ui:5001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
