# Temporary nginx config used ONLY during first-time cert issuance.
# Serves the ACME challenge on port 80 so certbot can verify domain ownership.
# This container is started and stopped by prod.sh before the main stack launches.

server {
    listen 80;
    server_name noonchi.live www.noonchi.live;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'noonchi.live — cert pending';
        add_header Content-Type text/plain;
    }
}
